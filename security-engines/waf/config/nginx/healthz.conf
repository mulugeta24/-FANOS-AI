# ──────────────────────────────────────────────────────────────
# FANOS WAF — Health Check Endpoint
# ──────────────────────────────────────────────────────────────
#
# Provides GET /healthz returning 200 OK when NGINX is running.
# Mounted to /etc/nginx/conf.d/healthz.conf inside the WAF container.
#
# ──────────────────────────────────────────────────────────────

server {
    listen 8080;
    server_name localhost;

    # Health check endpoint — no WAF inspection needed
    location /healthz {
        access_log off;
        modsecurity off;
        return 200 'FANOS WAF OK';
        add_header Content-Type text/plain;
    }
}
