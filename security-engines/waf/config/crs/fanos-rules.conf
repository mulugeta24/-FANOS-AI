# ──────────────────────────────────────────────────────────────
# FANOS AI — Custom WAF Security Rules
# ──────────────────────────────────────────────────────────────
#
# Rule ID Range : 9500000 – 9500099  (avoids OWASP CRS collision)
# Plugin Layer  : Loaded via /etc/modsecurity.d/owasp-crs/plugins/
# Purpose       : FANOS-specific detection patterns that complement
#                 (not duplicate) the OWASP Core Rule Set.
#
# Tags:
#   FANOS_CUSTOM          — marks every rule as FANOS-originated
#   attack-<category>     — matches CRS tag conventions
#
# ──────────────────────────────────────────────────────────────


# ══════════════════════════════════════════════════════════════
#  1. SQL INJECTION — FANOS-specific patterns
# ══════════════════════════════════════════════════════════════

# Time-based blind SQLi functions not fully covered by default CRS
SecRule ARGS|ARGS_NAMES|REQUEST_BODY "@rx (?i:(?:waitfor\s+delay|benchmark\s*\(|pg_sleep\s*\(|sleep\s*\(\s*\d|dbms_pipe\.receive_message))" \
    "id:9500001,\
    phase:2,\
    block,\
    log,\
    msg:'FANOS: Time-based blind SQL injection attempt',\
    tag:'FANOS_CUSTOM',\
    tag:'attack-sqli',\
    severity:'CRITICAL',\
    setvar:'tx.anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# Stacked queries and UNION-based patterns with obfuscation
SecRule ARGS|REQUEST_BODY "@rx (?i:(?:;\s*(?:drop|alter|truncate|create)\s+(?:table|database|index)|union\s+(?:all\s+)?select\s+(?:null|char|concat|0x)))" \
    "id:9500002,\
    phase:2,\
    block,\
    log,\
    msg:'FANOS: Stacked query / UNION injection attempt',\
    tag:'FANOS_CUSTOM',\
    tag:'attack-sqli',\
    severity:'CRITICAL',\
    setvar:'tx.anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# NoSQL injection patterns (MongoDB)
SecRule ARGS|ARGS_NAMES|REQUEST_BODY "@rx (?i:(?:\$(?:gt|gte|lt|lte|ne|nin|in|exists|regex|where)\b|\{\s*\$))" \
    "id:9500003,\
    phase:2,\
    block,\
    log,\
    msg:'FANOS: NoSQL injection attempt (MongoDB operator)',\
    tag:'FANOS_CUSTOM',\
    tag:'attack-sqli',\
    severity:'ERROR',\
    setvar:'tx.anomaly_score_pl1=+%{tx.error_anomaly_score}'"


# ══════════════════════════════════════════════════════════════
#  2. CROSS-SITE SCRIPTING (XSS) — DOM-based & event handlers
# ══════════════════════════════════════════════════════════════

# DOM XSS via javascript: protocol and data: URIs
SecRule ARGS|REQUEST_BODY "@rx (?i:(?:javascript\s*:|data\s*:\s*text/html|vbscript\s*:))" \
    "id:9500010,\
    phase:2,\
    block,\
    log,\
    msg:'FANOS: DOM-based XSS via protocol handler',\
    tag:'FANOS_CUSTOM',\
    tag:'attack-xss',\
    severity:'ERROR',\
    setvar:'tx.anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# Event handler injection
SecRule ARGS|REQUEST_BODY "@rx (?i:(?:\bon(?:error|load|mouseover|click|focus|blur|submit|change|input|keyup|keydown)\s*=))" \
    "id:9500011,\
    phase:2,\
    block,\
    log,\
    msg:'FANOS: XSS via HTML event handler injection',\
    tag:'FANOS_CUSTOM',\
    tag:'attack-xss',\
    severity:'ERROR',\
    setvar:'tx.anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# SVG/Math XSS vectors
SecRule ARGS|REQUEST_BODY "@rx (?i:<\s*(?:svg|math|iframe|embed|object|applet|form)\b[^>]*>)" \
    "id:9500012,\
    phase:2,\
    block,\
    log,\
    msg:'FANOS: XSS via dangerous HTML element',\
    tag:'FANOS_CUSTOM',\
    tag:'attack-xss',\
    severity:'ERROR',\
    setvar:'tx.anomaly_score_pl1=+%{tx.error_anomaly_score}'"


# ══════════════════════════════════════════════════════════════
#  3. COMMAND INJECTION
# ══════════════════════════════════════════════════════════════

# Shell command chaining operators with common commands
SecRule ARGS|REQUEST_BODY "@rx (?:(?:;|\|{1,2}|&&|\x60)\s*(?:cat|ls|dir|whoami|id|uname|curl|wget|nc|ncat|bash|sh|powershell|cmd)\b)" \
    "id:9500020,\
    phase:2,\
    block,\
    log,\
    msg:'FANOS: OS command injection attempt',\
    tag:'FANOS_CUSTOM',\
    tag:'attack-rce',\
    severity:'CRITICAL',\
    setvar:'tx.anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# Backtick and $() command substitution
SecRule ARGS|REQUEST_BODY "@rx (?:\x60[^`]*\x60|\$\(\s*(?:cat|ls|id|whoami|uname|curl|wget|nc))" \
    "id:9500021,\
    phase:2,\
    block,\
    log,\
    msg:'FANOS: Command substitution injection',\
    tag:'FANOS_CUSTOM',\
    tag:'attack-rce',\
    severity:'CRITICAL',\
    setvar:'tx.anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# ══════════════════════════════════════════════════════════════
#  4. PATH TRAVERSAL
# ══════════════════════════════════════════════════════════════

# Directory traversal with sensitive file targets
SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx (?:(?:\.\./|\.\.\\\\){2,}|(?:\.\./|\.\.\\\\)(?:etc/(?:passwd|shadow|hosts)|proc/self|windows/(?:system32|win\.ini)))" \
    "id:9500030,\
    phase:2,\
    block,\
    log,\
    msg:'FANOS: Path traversal to sensitive system file',\
    tag:'FANOS_CUSTOM',\
    tag:'attack-lfi',\
    severity:'CRITICAL',\
    setvar:'tx.anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# Encoded directory traversal (%2e%2e, %252e%252e, etc.)
SecRule REQUEST_URI|ARGS "@rx (?:%(?:2e|252e)%(?:2e|252e)[/\\\\]|%(?:2f|252f)%(?:2e|252e)%(?:2e|252e))" \
    "id:9500031,\
    phase:2,\
    block,\
    log,\
    msg:'FANOS: Encoded path traversal attempt',\
    tag:'FANOS_CUSTOM',\
    tag:'attack-lfi',\
    severity:'ERROR',\
    setvar:'tx.anomaly_score_pl1=+%{tx.error_anomaly_score}'"


# ══════════════════════════════════════════════════════════════
#  5. SERVER-SIDE REQUEST FORGERY (SSRF)
# ══════════════════════════════════════════════════════════════

# Cloud metadata endpoints and internal networks
SecRule ARGS|REQUEST_BODY "@rx (?i:(?:169\.254\.169\.254|metadata\.google\.internal|100\.100\.100\.200|fd00:ec2::254))" \
    "id:9500040,\
    phase:2,\
    block,\
    log,\
    msg:'FANOS: SSRF attempt targeting cloud metadata service',\
    tag:'FANOS_CUSTOM',\
    tag:'attack-ssrf',\
    severity:'CRITICAL',\
    setvar:'tx.anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# SSRF to internal/private networks
SecRule ARGS|REQUEST_BODY "@rx (?i:(?:https?://(?:127\.0\.0\.1|0\.0\.0\.0|localhost|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3})))" \
    "id:9500041,\
    phase:2,\
    block,\
    log,\
    msg:'FANOS: SSRF attempt targeting internal network',\
    tag:'FANOS_CUSTOM',\
    tag:'attack-ssrf',\
    severity:'ERROR',\
    setvar:'tx.anomaly_score_pl1=+%{tx.error_anomaly_score}'"


# ══════════════════════════════════════════════════════════════
#  6. MALICIOUS FILE UPLOAD
# ══════════════════════════════════════════════════════════════

# Dangerous file extensions in multipart uploads
SecRule FILES_NAMES "@rx (?i:\.(?:php[3-8]?|phtml|jsp|jspx|asp|aspx|exe|bat|cmd|sh|bash|cgi|pl|py|rb|dll|so|com|msi|scr|ps1|psm1|psd1|vbs|vbe|wsf|wsh)$)" \
    "id:9500050,\
    phase:2,\
    block,\
    log,\
    msg:'FANOS: Malicious file upload — dangerous extension',\
    tag:'FANOS_CUSTOM',\
    tag:'attack-file-upload',\
    severity:'CRITICAL',\
    setvar:'tx.anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# Webshell signatures in uploaded content
SecRule REQUEST_BODY "@rx (?i:(?:<\?php|<\?=|<%@?\s*(?:page|import)|eval\s*\(|exec\s*\(|system\s*\(|passthru\s*\(|shell_exec\s*\())" \
    "id:9500051,\
    phase:2,\
    block,\
    log,\
    msg:'FANOS: Webshell signature detected in upload',\
    tag:'FANOS_CUSTOM',\
    tag:'attack-file-upload',\
    severity:'CRITICAL',\
    setvar:'tx.anomaly_score_pl1=+%{tx.critical_anomaly_score}'"


# ══════════════════════════════════════════════════════════════
#  7. HTTP METHOD ABUSE
# ══════════════════════════════════════════════════════════════

# Block dangerous HTTP methods
SecRule REQUEST_METHOD "@rx ^(?:TRACE|TRACK|CONNECT|DEBUG|MOVE|COPY|PROPFIND|PROPPATCH|MKCOL|LOCK|UNLOCK)$" \
    "id:9500060,\
    phase:1,\
    block,\
    log,\
    msg:'FANOS: Blocked dangerous HTTP method — %{REQUEST_METHOD}',\
    tag:'FANOS_CUSTOM',\
    tag:'attack-protocol',\
    severity:'WARNING',\
    setvar:'tx.anomaly_score_pl1=+%{tx.warning_anomaly_score}'"


# ══════════════════════════════════════════════════════════════
#  8. SUSPICIOUS HEADERS
# ══════════════════════════════════════════════════════════════

# X-Forwarded-For spoofing with internal IPs
SecRule REQUEST_HEADERS:X-Forwarded-For "@rx (?:127\.0\.0\.1|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|0\.0\.0\.0)" \
    "id:9500070,\
    phase:1,\
    log,\
    pass,\
    msg:'FANOS: Suspicious X-Forwarded-For header with internal IP',\
    tag:'FANOS_CUSTOM',\
    tag:'attack-protocol',\
    severity:'NOTICE',\
    setvar:'tx.anomaly_score_pl1=+%{tx.notice_anomaly_score}'"

# Missing or blank Host header
SecRule REQUEST_HEADERS:Host "@rx ^$" \
    "id:9500071,\
    phase:1,\
    block,\
    log,\
    msg:'FANOS: Blank Host header — possible scanning/bot',\
    tag:'FANOS_CUSTOM',\
    tag:'attack-protocol',\
    severity:'WARNING',\
    setvar:'tx.anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# Suspicious originating IP headers (often used in attacks)
SecRule REQUEST_HEADERS_NAMES "@rx (?i:^(?:x-originating-ip|x-remote-ip|x-remote-addr|x-client-ip|x-real-ip)$)" \
    "id:9500072,\
    phase:1,\
    log,\
    pass,\
    msg:'FANOS: Suspicious IP-related header detected — %{MATCHED_VAR}',\
    tag:'FANOS_CUSTOM',\
    tag:'attack-protocol',\
    severity:'NOTICE',\
    setvar:'tx.anomaly_score_pl1=+%{tx.notice_anomaly_score}'"


# ══════════════════════════════════════════════════════════════
#  9. ABNORMAL REQUEST PATTERNS
# ══════════════════════════════════════════════════════════════

# Null bytes in request URI or arguments
SecRule REQUEST_URI|ARGS|ARGS_NAMES "@rx %00|\\x00" \
    "id:9500080,\
    phase:2,\
    block,\
    log,\
    msg:'FANOS: Null byte injection detected',\
    tag:'FANOS_CUSTOM',\
    tag:'attack-protocol',\
    severity:'ERROR',\
    setvar:'tx.anomaly_score_pl1=+%{tx.error_anomaly_score}'"

# Oversized URI (>2048 chars is abnormal for most apps)
SecRule REQUEST_URI "@gt 2048" \
    "id:9500081,\
    phase:1,\
    block,\
    log,\
    msg:'FANOS: Abnormally long request URI detected',\
    tag:'FANOS_CUSTOM',\
    tag:'attack-protocol',\
    severity:'WARNING',\
    setvar:'tx.anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# Multiple encoding layers (double-encoding evasion)
SecRule REQUEST_URI|ARGS "@rx %25(?:2[0-9a-fA-F]|3[0-9a-fA-F]|7[0-9a-fA-F])" \
    "id:9500082,\
    phase:2,\
    log,\
    pass,\
    msg:'FANOS: Double URL-encoding detected — possible evasion',\
    tag:'FANOS_CUSTOM',\
    tag:'attack-protocol',\
    severity:'WARNING',\
    setvar:'tx.anomaly_score_pl1=+%{tx.warning_anomaly_score}'"


# ──────────────────────────────────────────────────────────────
# End of FANOS Custom Rules
# ──────────────────────────────────────────────────────────────
